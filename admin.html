<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Final Year BBQ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html">🔥 BBQ Admin</a>
  <div><span id="who" class="link" style="color:var(--cream);font-size:.85rem"></span>
  <button class="btn btn-ghost btn-sm hidden" id="logout" style="color:var(--cream);border-color:var(--gold);margin-left:12px">Log out</button></div>
</div></nav>

<!-- LOGIN -->
<section class="section" id="loginView"><div class="wrap" style="max-width:440px">
  <form class="card" id="loginForm">
    <h2 style="font-size:1.6rem;margin-bottom:6px">Organiser login</h2>
    <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
    <label for="pass">Password</label><input id="pass" type="password" required autocomplete="current-password">
    <div class="alert hidden" id="loginMsg"></div>
    <button class="btn btn-green" style="width:100%;margin-top:16px" type="submit">Sign in</button>
  </form>
</div></section>

<!-- DASHBOARD -->
<main class="hidden" id="dash"><div class="wrap" style="padding:30px 0 60px">
  <div class="grid g4" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="people">Participants</button>
    <button class="tab" data-tab="pkgs">Packages</button>
    <button class="tab" data-tab="event">Event info</button>
  </div>

  <div id="tab-people">
    <div class="toolbar">
      <input id="q" placeholder="Search name, phone or matric no.">
      <select id="fPkg"><option value="">All packages</option></select>
      <select id="fStatus"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
      <button class="btn btn-gold btn-sm" id="csv">Export CSV</button>
      <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
    </div>
    <div class="alert hidden" id="adminMsg"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Participant</th><th>Package</th><th>Amount</th><th>OPay ref</th><th>Status</th><th>Seat</th><th>Submitted</th><th>Actions</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody>
    </table></div>
    <p class="hint" id="count" style="margin-top:8px"></p>
    <p class="hint">⚠️ Always confirm the real transaction in your OPay app (amount + reference) BEFORE approving.</p>
  </div>

  <div id="tab-pkgs" class="hidden"><div class="card" style="margin-top:20px" id="pkgEdit"></div></div>
  <div id="tab-event" class="hidden"><div class="card" style="margin-top:20px" id="eventInfo"></div></div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
